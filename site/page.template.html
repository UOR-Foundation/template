    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./fonts/Archivo-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/Geist-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="modulepreload" href="./app.mjs" />
    <script type="speculationrules" data-prism-ahead>{{SPECULATION_RULES}}</script>
    {{FRAME_CONNECT}}
    <style>{{INLINE_CSS}}</style>
    <script>{{INLINE_THEME}}</script>
  </head>
  <body>
    <prism-frame id="frame" name="{{NAME}}" address="{{HOLO_NAME}}" live="{{LIVE}}" repo="{{REPO}}" home="{{HOLO_SEARCH}}" purpose="{{PURPOSE}}" card="{{OG_IMAGE}}" identity="#spec" accounts="{{ACCOUNTS}}" proof="{{PROMISE_HEADLINE}}" proof-url="{{ATT_PROOF_URL}}">
      <a class="frame-fallback" href="{{HOLO_SEARCH}}" aria-label="Hologram: home"><span class="mark" aria-hidden="true"></span><span class="field"><span class="scheme">holo://</span>{{HOLO_NAME}}</span></a>
      <span slot="status" id="update" class="chip chip-warn" hidden><button id="reload" class="bare" type="button">Update available. Reload</button></span>
    </prism-frame>

    <!-- Workspace: a header row, the app's surface on the left at full height,
         and a rail on the right for its result, its actions and what you did.
         On a phone the rail becomes one bar under the surface. -->
    <main id="main">
      <header class="head">
        <div class="ident">
          <h1 id="name">{{NAME}}</h1>
          <p id="lede" class="lede">{{TAGLINE}}</p>
        </div>
        <a id="open-spec" class="spec-link" href="#spec" aria-controls="spec" aria-expanded="false" aria-keyshortcuts=".">{{ICON_DOC}}<span>View spec</span></a>
      </header>
      <div class="ws" id="ws">
        <div class="stage" id="stage">
{{SURFACE}}
        </div>
        <div class="rail" id="rail">
          <div class="result" id="result" aria-live="polite"><output id="out" class="idle">—</output></div>
          <div class="actions"><p class="k" id="actions-k">{{ACTIONS_LABEL}}</p><div class="tries" id="tries">{{TRIES}}</div></div>
          <div class="history"><p class="k" id="history-k">Recent</p><ol class="list" id="hist"></ol></div>
          <p id="offline" class="offline" hidden>Offline. Everything here still works.</p>
        </div>
      </div>
    </main>
    <!-- The spec: why to trust the app, how it is proved, what runs. It slides
         in beside the window (on a phone, over it), rendered at build to spec.html
         from the holo and the LexLean source, and loaded the first time it
         opens. -->
    <aside id="spec" class="spec" aria-label="Spec" tabindex="-1" inert>
      <header class="spec-head">
        <span class="spec-title">Spec</span><span class="spec-ver">{{VERSION}}</span>
        <button id="close-spec" class="spec-x" type="button" aria-label="Close the spec">{{ICON_X}}</button>
      </header>
      <div class="spec-body" id="spec-body"><p class="spec-wait">Loading the spec</p></div>
      <div id="evidence-hold" hidden></div>
    </aside>
{{CARD}}
    <noscript><p class="noscript">This page needs JavaScript to load and verify the app in your browser.</p></noscript>
    <script type="application/json" id="app-data">{{APP_DATA}}</script>
    <script type="importmap">{{IMPORTMAP}}</script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
