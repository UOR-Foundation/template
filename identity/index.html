<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://registry.uor.foundation; base-uri 'none'; form-action 'none'" />
    <meta name="prism-registry" content="https://registry.uor.foundation" />
    <title>Prism account</title>
    <link rel="stylesheet" href="brand.css" />
    <link rel="stylesheet" href="id.css" />
    <script type="module" src="id.mjs"></script>
  </head>
  <body>
    <main id="card" aria-live="polite">
      <button id="go" class="primary" type="button" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5" /><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" /></svg>
        <span id="go-label">Sign in</span>
      </button>
      <p id="fresh" class="note" hidden>No passkey on this device yet. <button id="again" class="link" type="button">Try again</button></p>
      <p id="lost" class="note" hidden><button id="use-code" class="link" type="button">Lost your device? Use a recovery code</button></p>
      <div id="recover" class="stack" hidden>
        <label class="note" for="code">Your recovery code</label>
        <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX XXXX XXXX …" />
        <button id="recover-go" class="primary" type="button">Recover on this device</button>
      </div>
      <div id="kit" class="stack" hidden>
        <p class="note">Your recovery code. It brings this account to any device if you lose this one. Keep it offline, somewhere safe: anyone holding it can add a device.</p>
        <output id="kit-code" class="code"></output>
        <div class="pair">
          <button id="kit-copy" type="button">Copy</button>
          <button id="kit-save" type="button">Download</button>
        </div>
        <button id="kit-done" class="primary" type="button">I saved it</button>
      </div>
      <p id="error" class="error" hidden></p>
    </main>
  </body>
</html>
