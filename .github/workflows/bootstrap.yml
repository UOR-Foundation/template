# This is the minimal human-reviewed trust root. PrismPM does not generate it.
name: bootstrap

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other run (main,
# a tag, a merge queue's) has a group of its own, so a main or tag run is never
# cancelled, and never replaced while queued, and every merged or released
# commit keeps its verdict.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bootstrap-pr-{0}', github.event.pull_request.number) || format('bootstrap-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template-gate:
    name: acceptance / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request, and a merge queue's run of it, run the complete gate
        # once, natively on amd64. Main and tags run it on both native
        # architectures before anything is published.
        runner: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Proving the application is the slowest part of the gate. A run keeps the
      # proof here, keyed by every byte the proof reads; `just app` reuses it only
      # on a pull request or a merge queue run, whose merge commit main proves
      # again in full. Main and tags always prove.
      - name: The proof of these exact proof inputs, kept by an earlier run
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .prism-proof
          key: prism-proof-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/**', 'prismpm.lock', 'Justfile', 'rust-toolchain.toml') }}
      - name: Run the template gate through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          if test -f "$HOME/.docker/config.json"; then
            cp "$HOME/.docker/config.json" "$docker_config/config.json"
          else
            printf '{}\n' >"$docker_config/config.json"
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env PRISM_PROOF_EVENT=${{ github.event_name }} \
            --env SDK_IMAGE="$image" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              docker buildx version
              docker buildx inspect --bootstrap
              manifest=$(docker buildx imagetools inspect "$SDK_IMAGE")
              grep -q "linux/amd64" <<< "$manifest"
              grep -q "linux/arm64" <<< "$manifest"
              devcontainer --version
              exec just vv
            '
