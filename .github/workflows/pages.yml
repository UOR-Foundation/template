# Publishes the repository's app page: `site/` with the holo that `build.yml`
# builds and verifies through the locked SDK. Project content, not universal
# policy: a repository may extend or replace it.
#
# It runs on every push to main, beside `bootstrap`, not after it: `just app`
# is the proof-bearing build (the Lean kernel checks every theorem before the
# holo exists), so the page goes live as soon as that passes, while the rest of
# the gate runs on both architectures. The SDK step is `build.yml`'s, called
# here, so the page and `prism-code build --remote github` publish the same
# holo from the same step; the page takes it from that run's artifact, with
# the signed provenance beside it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: the brand and the frame against brand.lock and frame.lock
    # The template repository publishes its try page instead (try-page.yml).
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the brand and the frame, before any build is spent
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check

  build:
    name: build and verify the holo
    needs: checks
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  page:
    name: assemble the page from the verified holo
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Take the holo and its provenance from the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/prism-build
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ runner.temp }}/prism-build/build/${{ needs.build.outputs.holo }}
          BUILD: ${{ runner.temp }}/prism-build/build.json
          ATTESTATION_URL: ${{ needs.build.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          # The page says where this holo's provenance is: the record of the
          # build that made it and the signed statement GitHub keeps for it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [build, url] = process.argv.slice(1);
            const record = JSON.parse(readFileSync(build, "utf8"));
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id: record.fingerprint, url: url || record.run_url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$BUILD" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
      - name: Lighthouse at 100 on mobile, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          lhci autorun --config=lighthouserc.json
      - name: Every Material 3 window size class, both themes, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
          node bootstrap/screens.mjs site screens
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    name: publish the page
    needs: page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
