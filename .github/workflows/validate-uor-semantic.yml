name: validate-uor-semantic

on:
  push:
    branches: [validation/uor-semantic-cli]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  acceptance:
    name: Rust 1.97.1 acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - uses: extractions/setup-just@v2

      - name: Reconstruct uor-semantic workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uor-semantic
          mkdir -p /tmp/uor-semantic
          cat .ci/uor-semantic.b64.part* | base64 --decode > /tmp/uor-semantic.tar.xz
          tar -xJf /tmp/uor-semantic.tar.xz -C /tmp/uor-semantic
          test -f /tmp/uor-semantic/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/uor-semantic/crates/uor-semantic/src/artifact.rs')
          text = path.read_text()

          replacements = [
              (
                  "pub const ARTIFACT_MAGIC: [u8; 8] = [b'U', b'O', b'R', b'S', b'E', b'M', b'0', b'1'];",
                  'pub const ARTIFACT_MAGIC: [u8; 8] = *b"UORSEM01";',
              ),
              (
                  '    let mut output = [\n        0x243f_6a88_85a3_08d3,',
                  '    let mut output: [u64; SIGNATURE_WORDS] = [\n        0x243f_6a88_85a3_08d3,',
              ),
              (
                  'fn margin_bonus(margin: MembershipMargin) -> i32 {\n'
                  '    match i32::try_from(margin.get()) {\n'
                  '        Ok(value) => value,\n'
                  '        Err(_) => i32::MAX,\n'
                  '    }\n'
                  '}',
                  'fn margin_bonus(margin: MembershipMargin) -> i32 {\n'
                  '    i32::try_from(margin.get()).unwrap_or(i32::MAX)\n'
                  '}',
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'patch anchor not found: {old[:80]!r}')

          path.write_text(text)
          PY

      - name: Show toolchain
        working-directory: /tmp/uor-semantic
        run: |
          rustc --version --verbose
          cargo --version

      - name: Apply canonical rustfmt
        working-directory: /tmp/uor-semantic
        run: cargo fmt --all

      - name: Run normative acceptance gate
        working-directory: /tmp/uor-semantic
        run: just vv

      - name: Package formatted workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uor-semantic/target /tmp/uor-semantic/scripts/__pycache__
          tar --exclude=target --exclude=__pycache__ -cJf /tmp/uor-semantic-formatted.tar.xz -C /tmp/uor-semantic .

      - name: Upload formatted workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uor-semantic-formatted
          path: /tmp/uor-semantic-formatted.tar.xz
          if-no-files-found: error
          retention-days: 1