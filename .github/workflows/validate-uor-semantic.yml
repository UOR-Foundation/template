name: validate-uor-semantic

on:
  push:
    branches: [validation/uor-semantic-cli]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  acceptance:
    name: Rust 1.97.1 acceptance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - uses: extractions/setup-just@v2

      - name: Reconstruct uor-semantic workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uor-semantic
          mkdir -p /tmp/uor-semantic
          cat .ci/uor-semantic.b64.part* | base64 --decode > /tmp/uor-semantic.tar.xz
          tar -xJf /tmp/uor-semantic.tar.xz -C /tmp/uor-semantic
          test -f /tmp/uor-semantic/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/uor-semantic/crates/uor-semantic/src/artifact.rs')
          text = path.read_text()
          old = '    let mut output = [\n        0x243f_6a88_85a3_08d3,'
          new = '    let mut output: [u64; SIGNATURE_WORDS] = [\n        0x243f_6a88_85a3_08d3,'
          if old not in text and new not in text:
              raise SystemExit('context_signature patch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Show toolchain
        working-directory: /tmp/uor-semantic
        run: |
          rustc --version --verbose
          cargo --version

      - name: Apply canonical rustfmt
        working-directory: /tmp/uor-semantic
        run: cargo fmt --all

      - name: Run normative acceptance gate
        working-directory: /tmp/uor-semantic
        run: just vv

      - name: Package formatted workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=target -cJf /tmp/uor-semantic-formatted.tar.xz -C /tmp/uor-semantic .

      - name: Upload formatted workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uor-semantic-formatted
          path: /tmp/uor-semantic-formatted.tar.xz
          if-no-files-found: error
          retention-days: 1
